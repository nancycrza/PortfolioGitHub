<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fun To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>
        <div class="logo">
            ✦ My To-Do List
        </div>

       
    </header>


    <!-- MAIN -->

    <main>

        <section class="todo-container">

            <div class="title-area">

                <p class="hello">
                    Let's get things done!
                </p>

                <h1>
                    My
                    <span>To-Do</span>
                    List
                </h1>

                <p class="subtitle">
                    Organize your day, one task at a time.
                </p>

            </div>


            <!-- ADD TASK -->

            <div class="input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    aria-label="New task"
                >

                <button id="addButton">
                    + Add Task
                </button>

            </div>


            <!-- TASK INFORMATION -->

            <div class="task-info">

                <p>
                    <span id="taskCount">0</span>
                    tasks remaining
                </p>

                <button id="clearCompleted">
                    Clear Completed
                </button>

            </div>


            <!-- FILTER BUTTONS -->

            <div class="filters">

                <button
                    class="filter-button active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="filter-button"
                    data-filter="active">
                    Active
                </button>

                <button
                    class="filter-button"
                    data-filter="completed">
                    Completed
                </button>

            </div>


            <!-- TASK LIST -->

            <ul id="taskList">
            </ul>


            <!-- EMPTY MESSAGE -->

            <div id="emptyMessage" class="empty-message">

                <div class="empty-icon">
                    ✨
                </div>

                <h2>
                    Nothing here yet!
                </h2>

                <p>
                    Add a task and let's make today productive.
                </p>

            </div>


            <!-- PROGRESS -->

            <div class="progress-area">

                <div class="progress-text">
                    <span>Daily Progress</span>
                    <span id="progressPercent">0%</span>
                </div>

                <div class="progress-bar">
                    <div
                        id="progressFill"
                        class="progress-fill">
                    </div>
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        <p>
            Created with HTML, CSS & JavaScript ✦
        </p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
